<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#142535"><title>Tarjeta médica · Club Médico Utatlan</title>
  <link rel="icon" href="logo.png"><link rel="stylesheet" href="tarjeta.css">
</head>
<body>
  <header><a class="brand" href="portal.html"><img src="logo.png" alt="Sanatorio Privado Utatlan"><span>SANATORIO PRIVADO<br><strong>UTATLAN</strong></span></a><a id="portal-top" href="portal.html">Ir a mi portal →</a></header>
  <main>
    <p class="eyebrow">Club Médico Utatlan</p><h1>Mi tarjeta médica.</h1><p class="lead">Tu identificación en Recepción y el acceso a tu portal, en una sola tarjeta.</p>
    <div class="cards">
      <section class="card front" aria-label="Frente de la tarjeta">
        <img class="card-art" src="frente-club-medico.png" alt="Frente de la tarjeta Club Médico Utatlan">
      </section>
      <section class="card back" aria-label="Reverso de la tarjeta">
        <img class="card-art" src="reverso-club-medico.png" alt="Reverso de la tarjeta Club Médico Utatlan">
      </section>
    </div>
    <p class="card-category">Categoría <strong id="level">BRONCE</strong></p>
    <div class="actions"><a id="portal-link" href="portal.html">Abrir mi portal →</a><span>Presenta el código de barras en Recepción al registrar un procedimiento privado.</span></div>
  </main>
  <script src="state.js"></script><script src="tarjeta.js"></script>
</body>
</html>
